# Palomar's own mechanical verifier, run as the preflight its submission protocol asks for.
# Pinned to one PalomarSubmission commit, as their README shows.
name: Palomar preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character commit to verify
        required: true
        default: 3a9449ce0e3e9f9355f15827ce5d99a4460efa0c

permissions:
  contents: read

jobs:
  palomar-preflight:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: ${{ github.repository }}
      commit: ${{ inputs.commit }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","authorization_relationship":"I am a responsible author or maintainer"}'
