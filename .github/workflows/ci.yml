# Checks the proof the way Palomar does. The steps come from PalomarRegistry/PalomarTemplate.
# lake comparator ships with the Lean toolchain and replays the proof through Lean's kernel,
# nanoda and con-ron.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Lean
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: true
      - name: Print axioms
        run: lake env lean audit/Axioms.lean

  comparator:
    name: Check statement against solution
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Lean source requirements
        run: python3 scripts/check-lean-sources.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Install bubblewrap for the comparator sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run lake comparator
        run: ./scripts/verify-comparator.sh

  metadata:
    name: Check formalization.yaml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
      - name: Validate formalization.yaml
        run: ruby scripts/validate-formalization.rb
